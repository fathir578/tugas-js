<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>crud sederhana js
    </title>
    <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    input {
      padding: 6px;
    }

    button {
      margin-left: 4px;
      padding: 5px 8px;
      cursor: pointer;
    }

    li {
      margin: 6px 0;
    }
  </style>
</head>
<body>
    
  <h2>CRUD Data Siswa</h2>

  <input type="text" id="nama" placeholder="Nama siswa">
  <button onclick="tambahData()">Simpan</button>

  <ul id="list"></ul>

  <script>

    let data = []
    let editIndex = null

     function tambahData() {
      const input = document.getElementById("nama")
      const nama = input.value.trim()

      if (nama === "") {
        alert("Nama tidak boleh kosong")
        return
      }
      if (editIndex === null) {
        // CREATE
        data.push(nama)
         } else {
        // UPDATE
        data[editIndex] = nama
        editIndex = null
      }

      input.value = ""
      renderData()
    }

    </script>

</body>
</html>
